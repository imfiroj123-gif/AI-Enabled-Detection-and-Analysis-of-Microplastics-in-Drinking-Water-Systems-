<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Droplet Glow Gradient -->
    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square / Lab Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0b1329" stroke="url(#ringGrad)" stroke-width="1.8" />
  
  <!-- Subtle Neural Grid Accent Lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Scientific Hexagonal Aperture Ring -->
  <polygon points="32,9 51,20 51,44 32,55 13,44 13,20" fill="none" stroke="url(#ringGrad)" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Water Droplet Silhouette -->
  <path d="M32 14 C32 14, 46 31, 46 39.5 C46 47.5, 39.7 51, 32 51 C24.3 51, 18 47.5, 18 39.5 C18 31, 32 14, 32 14 Z" 
        fill="url(#dropGrad)" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        filter="url(#glow)" />

  <!-- Specular Reflection on Droplet -->
  <path d="M26 27 C28 22, 32 18, 32 18 C31 22, 28 29, 26 34 C25 36, 23 37, 23 35 C23 33, 24.5 30, 26 27 Z" fill="#ffffff" opacity="0.65" />

  <!-- Fluorescing Microplastic Particles Inside Droplet -->
  <!-- Micro-fiber (cyan line) -->
  <path d="M25 38 Q32 33 37 42" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Micro-fragment (red/rose shard) -->
  <polygon points="27,43 31,41 30,45" fill="#f43f5e" stroke="#ffffff" stroke-width="0.5" />

  <!-- Micro-bead / microsphere (gold orb) -->
  <circle cx="37" cy="33" r="2.2" fill="#eab308" stroke="#ffffff" stroke-width="0.5" filter="url(#glow)" />

  <!-- Secondary Nano-particle (emerald film) -->
  <rect x="26" y="32" width="2.5" height="2.5" transform="rotate(25 27 33)" fill="#10b981" />

  <!-- Outer Orbiting Sensor Nodes -->
  <circle cx="32" cy="7" r="2.2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="53" cy="45" r="2.2" fill="#14b8a6" filter="url(#glow)" />
  <circle cx="11" cy="45" r="2.2" fill="#10b981" filter="url(#glow)" />
</svg>
